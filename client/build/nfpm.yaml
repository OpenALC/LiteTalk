# nfpm 打包配置（deb / rpm）
# ${ARCH} / ${VERSION} 由 CI 环境变量注入（VERSION 已去掉 v 前缀）
name: litetalk
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: OpenALC
homepage: https://github.com/OpenALC/LiteTalk
vendor: OpenALC
description: |
  轻音 LiteTalk 桌面语音联机客户端。
  基于 Wails v3 构建，运行时依赖 WebKitGTK 4.1（libopus 静态内置）。
contents:
  - src: ./build/bin/LiteTalk
    dst: /usr/bin/litetalk
    file_info:
      mode: 0755
  # 桌面菜单项与 hicolor 图标。文件名 = ApplicationID（Wayland 按 .desktop
  # 文件名匹配 app_id）；StartupWMClass / Icon 同值，与 main.go 的 Linux
  # ApplicationID 对齐。
  - src: ./build/linux/io.github.openalc.LiteTalk.desktop
    dst: /usr/share/applications/io.github.openalc.LiteTalk.desktop
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/256x256/apps/io.github.openalc.LiteTalk.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.openalc.LiteTalk.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/48x48/apps/io.github.openalc.LiteTalk.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.openalc.LiteTalk.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/32x32/apps/io.github.openalc.LiteTalk.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.openalc.LiteTalk.png
    file_info:
      mode: 0644
  # 第三方许可证（#117）：客户端静态链接 libopus / opusfile / ogg / WebRTC APM
  # （内含 abseil），二进制分发必须随附各许可证全文。目录由
  # build/third-party-licenses.sh 生成（CI 在打包前执行，产物落在 build/third-party）。
  #
  # 不要给 tree 加 file_info.mode：nfpm 会把该模式套到目录条目上，目录变成
  # 0644 后不可进入，非 root 用户 test -f 子文件会直接失败。留空即沿用源文件
  # 模式（文件 0644、目录 0755），与 git 检出的权限一致。
  - src: ./build/third-party
    dst: /usr/share/doc/litetalk/third-party
    type: tree
# 依赖对齐 WebKitGTK 4.1（gtk3 构建标签）：不再备选 webkit2gtk-4.0，去 portaudio。
# 音频后端 miniaudio 在运行时 dlopen alsa / pulse，故仍声明为依赖保证面板可用。
# libopus 已静态链接进二进制（third_party/opus-linux-*），不再声明运行时依赖。
overrides:
  deb:
    depends:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      # WebRTC APM 静态库用 C++ 编写，允许动态依赖系统 libstdc++（#43）。
      - libstdc++6
      - libasound2 | libasound2t64
      - libpulse0 | pipewire-pulse
  rpm:
    depends:
      - webkit2gtk4.1
      - gtk3
      # 同上：APM 的静态库需要系统 libstdc++（#43）。
      - libstdc++
      - alsa-lib
      - pulseaudio-libs
