# Wails v3 项目配置（wails3 dev / wails3 task 使用）。
# 本项目的 CI 打包不依赖 wails CLI（裸 go build + go-winres，见 .github/workflows/ci.yml），
# 本文件仅服务本地开发：wails3 dev 的监视、重建与运行流程。
version: '3'

info:
  companyName: "OpenALC"
  productName: "轻音 LiteTalk"
  productIdentifier: "io.github.openalc.LiteTalk"
  description: "开源自建的桌面语音聊天"
  copyright: "(c) 2026, OpenALC"
  comments: "SFU 架构的轻量语音开黑客户端"
  version: "dev"

# 开发模式：监视 *.go 变更 → 重建 → 重启；前端由 vite dev server 服务（HMR）。
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    # 前端依赖只装一次（pnpm，项目硬性约束）。
    - cmd: wails3 task common:install:frontend:deps
      type: once
    # vite dev server：端口由 wails3 dev 经 WAILS_VITE_PORT 注入（见 frontend/vite.config.ts）。
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    # 每次 *.go 变更：重建（dev 构建，无 production 标签 → 开发版 runtime.js + 走 FRONTEND_DEVSERVER_URL）。
    - cmd: wails3 task build
      type: blocking
    # 主进程：退出即整个 dev 会话结束（watcher 的 primary 语义）。
    - cmd: wails3 task run
      type: primary
