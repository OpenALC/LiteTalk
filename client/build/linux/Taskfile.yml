version: '3'

# Linux 平台构建。GTK4 + WebKitGTK 6.0 为默认路径（v1.10.0 起），构建环境需
# 系统安装 libgtk-4-dev / libwebkitgtk-6.0-dev（Ubuntu 24.04 包名）；
# -tags gtk3（GTK3 + WebKitGTK 4.1）为 legacy 回退路径，保留可构建。
# cgo：libopus 静态链接仓库内 third_party/opus-linux-*；热键需 libx11-dev /
# libxi-dev 与 pkg-config（CI 的 apt 步骤同款）。

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: 构建 Linux 客户端
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}} .
    vars:
      PRODUCTION: '{{.PRODUCTION | default "false"}}'
      VERSION: '{{.VERSION | default .DEFAULT_VERSION}}'
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-s -w -X main.version={{.VERSION}}"{{else}}-buildvcs=false -ldflags="-X main.version={{.VERSION}}"{{end}}'
    env:
      CGO_ENABLED: '1'
      GOOS: linux

  run:
    summary: 运行 Linux 客户端
    cmds:
      - cmd: './{{.BIN_DIR}}/{{.APP_NAME}}'
        platforms: [linux]

  package:
    summary: 生产构建（deb/rpm 由 CI 的 nfpm 流程负责）
    cmds:
      - task: build
        vars:
          PRODUCTION: "true"
