# 轻音 LiteTalk CI/CD（流程规范见仓库根 CLAUDE.md「CI 门禁」一节）
#
# 触发：
#   - push 分支 / pull_request / workflow_dispatch → 只跑「检查组」（全部阻塞）
#   - push v* 标签 → 检查组 + 打包组 + 发布 Release
# 阻塞性：检查组全部阻塞；打包组中 macOS 非阻塞（continue-on-error，且 release 条件不依赖其结果）。
#
# 注：本机开发（国内）Go 走 goproxy.cn、前端走项目级 .npmrc 的 npmmirror；
#     CI runner 在境外，Go/npm 均保持默认源。
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    # 纯文档提交不跑 CI（paths 过滤对标签推送不生效，发版不受影响）
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# 同一 ref 的新提交取消旧检查；标签发版永不取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'
  NFPM_VERSION: 'v2.48.0'
  SCHEMATHESIS_VERSION: '4.32.0'
  # #86：契约破坏性变更检测工具，锁版本（禁止 @latest）
  OASDIFF_VERSION: 'v1.34.0'

jobs:
  # ======================= 检查组（每次 push / PR，全部阻塞） =======================

  # 版本规范：v<大>.<功能>.<修复>[-alpha|-beta|-rc]，禁止测试标志后加序号
  check-tag:
    name: 标签格式
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: 校验 ${{ github.ref_name }}
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc))?$ ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 不符合 v<大>.<功能>.<修复>[-alpha|-beta|-rc]"
            exit 1
          fi

  check-server:
    name: 服务端检查
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # 部署脚本没有单元测试：至少让语法错误在检查阶段暴露。
      # bash -n 只解析第一个文件（其余会被当作位置参数），必须逐个检查。
      - name: 部署脚本语法检查
        run: |
          for f in deploy/install.sh deploy/update.sh deploy/install_selftest.sh; do bash -n "$f"; done
      # 压缩包成员校验（#102）：符号链接/硬链接/FIFO/目录/白名单外/缺主二进制/重复条目
      # 都必须被 verify_archive 拒掉。自测脚本 source install.sh 取函数，不需要 root。
      - name: 部署脚本自测（install.sh 压缩包校验）
        run: bash deploy/install_selftest.sh
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::以下文件未 gofmt："; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test（-race）
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...
      # 生成物新鲜度：契约（api/openapi.yaml + api/signal/）改了必须重新生成并提交。
      # -skip-ts：TS 半边（types.gen.ts）在 check-frontend 校验（那侧才有 node_modules）。
      - name: 生成代码新鲜度（signalgen + openapigen）
        run: |
          go run ./api/tools/signalgen
          go run ./api/tools/openapigen -skip-ts
          git diff --exit-code

  # 独立真库门禁：全量 Store 测试覆盖邮箱、Webhook 与已有 MySQL 合约。
  check-mysql:
    name: MySQL 真库检查
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: litetalk_ci_only
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=litetalk_ci_only --silent"
          --health-start-period=30s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: server
    env:
      LITETALK_MYSQL_DSN: 'root:litetalk_ci_only@tcp(127.0.0.1:3306)/?parseTime=true&loc=UTC'
      LITETALK_MYSQL_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 真库 Store 合约（-race，禁止 MySQL 跳过）
        run: |
          set -o pipefail
          test -n "$LITETALK_MYSQL_DSN"
          go test -race -count=1 -json ./internal/store | tee "$RUNNER_TEMP/mysql-tests.jsonl"
          if jq -e 'select(.Action == "skip" and ((.Test // "") | ascii_downcase | contains("mysql")))' "$RUNNER_TEMP/mysql-tests.jsonl" >/dev/null; then
            echo '::error::MySQL 真库测试出现跳过'
            exit 1
          fi
          for name in TestMySQLUserByEmailCaseInsensitive TestRecordWebhookDeliveryConcurrentMySQL; do
            if ! jq -e --arg name "$name" 'select(.Action == "pass" and .Test == $name)' "$RUNNER_TEMP/mysql-tests.jsonl" >/dev/null; then
              echo "::error::$name 未在真库运行并通过"
              exit 1
            fi
          done

  # 契约测试（#30）：契约 ↔ 实现双向比对 + 生成新鲜度 + schemathesis 模糊测试。
  # 阻塞发版（release 的 needs/if 都含本 job）。types.gen.ts 的新鲜度在 check-frontend
  # 校验（那侧有 pnpm），这里只管 Go 生成物。
  check-contract:
    name: 契约检查
    needs: check-server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          # #86：git describe 找上一个 release tag 需要完整历史与 tag
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 生成代码新鲜度（signalgen + openapigen）
        run: |
          go run ./api/tools/signalgen
          go run ./api/tools/openapigen -skip-ts
          git diff --exit-code
      # REST 路由双向比对 + 信令 catalog 与两侧生成物一致（server/api/tests）
      - name: 契约比对测试
        run: go test ./api/tests/... -count=1 -v
      # #86：与上一个 release tag 的契约对比，出现未批准的破坏性变更即失败。
      # tag 不含 api/openapi.yaml 时回落到 api/oasdiff-baseline.yaml（脚本内选择）；
      # 完整 breaking 列表与允许清单命中情况都打印在日志里。
      - name: 契约破坏性变更检测（oasdiff，锁版本）
        env:
          LITETALK_OASDIFF_DIR: ${{ runner.temp }}/oasdiff
        run: bash api/tests/run_breaking_check.sh
      - name: 安装 schemathesis（锁版本）
        run: |
          python3 -m venv "$RUNNER_TEMP/sth-venv"
          "$RUNNER_TEMP/sth-venv/bin/pip" install --quiet "schemathesis==$SCHEMATHESIS_VERSION"
          echo "$RUNNER_TEMP/sth-venv/bin" >> "$GITHUB_PATH"
      - name: schemathesis 模糊测试（固定 seed，无 5xx + 形状符合契约）
        env:
          LITETALK_FUZZ_DIR: ${{ runner.temp }}/fuzz-data
        run: bash api/tests/run_schemathesis.sh
      - name: 上传 fuzz 报告与服务端日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: contract-fuzz
          path: ${{ runner.temp }}/fuzz-data/
          retention-days: 7

  # 前端只在这里构建一次，dist 以 artifact 分发给客户端检查与各打包 job
  check-frontend:
    name: 前端检查
    runs-on: ubuntu-24.04
    # 标签构建注入发布标签作为 Web 客户端版本（#119）：否则浏览器版一直报
    # package.json 里的旧版本号。分支/PR 为空串，vite 回落 package.json。
    # 前端仍只在本 job 构建一次。
    env:
      LITELTALK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本由 client/frontend/package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 生成物新鲜度（TS 半边）：openapi.yaml 改了必须重新生成 types.gen.ts 并提交。
      - name: 生成代码新鲜度（types.gen.ts）
        run: |
          pnpm run gen:types
          git diff --exit-code -- src/api/types.gen.ts
      - name: 类型检查（vue-tsc）
        run: pnpm run type-check
      - name: 单元测试（vitest）
        run: pnpm test
      - name: 构建
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
          retention-days: 3
      # ---- #50 Web 客户端构建：base 绝对路径（服务端托管），产物 dist-web 独立
      # 目录，不覆盖上面的桌面构建。仍在本 job 构建（前端只在一个 job 构建）。
      # 发布包的 Web 客户端不能直接用 frontend-dist：桌面产物 base './' 是给
      # Wails 相对路径的，SPA 深链会解析错误。
      - name: 构建 Web 版
        run: pnpm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/frontend/dist-web
          retention-days: 3

  # Linux：默认 GTK4 + WebKitGTK 6.0 路径（不加标签；production 产物用 -tags production）。
  # v3 内部 cgo 包不受 server 标签豁免，勿用 server 标签做检查
  check-client-linux:
    name: 客户端检查（Linux）
    needs: check-frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # libx11-dev / libxi-dev 供 client/core/hotkey/hotkey_linux.go 的 cgo 用
      # （X11 + XInput2 raw 事件）。只是构建期开发库：libX11.so.6 / libXi.so.6 运行
      # 时已由 libgtk-4-1 传递依赖，nfpm 的 depends 不用动。
      # desktop-file-utils 供 .desktop 静态校验（issue #6），前移到检查
      # job：不依赖构建产物，dev 期间每次 push 都能发现打包期才暴露的问题。
      # xvfb / xauth / dbus-daemon 供同 job 的安装后启动冒烟（issue #6）：
      # v3 单实例锁走会话总线，没有 dbus-run-session 会在 application.New 里
      # fatal 退出（noble 上 dbus-run-session 属于 dbus-daemon 包，不是 dbus）；
      # libasound2t64 / libpulse0 与 nfpm 的 Depends 对齐，保证 dpkg -i 能
      # 独立验证依赖闭包。
      # glibc 符号基线检查（issue #9）复用本 job 的 production 产物，objdump
      # 来自 ubuntu-24.04 预装的 binutils，无需额外安装。
      - name: 安装 GTK/WebKitGTK/X11/desktop-file/冒烟依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libxi-dev desktop-file-utils \
            xvfb xauth dbus-daemon libasound2t64 libpulse0
      - name: desktop-file-validate（.desktop 静态校验）
        run: desktop-file-validate build/linux/io.github.openalc.LiteTalk.desktop
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "::error::以下文件未 gofmt："; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      # 第三方静态库产物校验（#117）：third_party/SHA256SUMS 记录每个 .a 的
      # SHA256 与来源（上游版本 + 构建参数）。库被替换/重建却没同步清单就红，
      # 避免发布出去的是来源不明的产物。清单本身钉死 LF（.gitattributes）。
      - name: 第三方库产物校验（SHA256SUMS）
        run: cd third_party && sha256sum -c SHA256SUMS
      - name: go vet
        run: go vet ./...
      - name: go test（默认 GTK4，-race）
        run: go test -race -count=1 ./...
      # GTK3 回退路径只覆盖不依赖图形开发库的配置边界；完整旧版构建仍属
      # 可选 legacy 产物决策，不在本 job 安装两套 WebKitGTK 开发库。
      - name: go test（legacy GTK3 配置边界，-race）
        run: go test -race -count=1 -tags gtk3 ./core/config
      - name: go build
        run: go build ./...
      # ---- issue #6/#5：安装后启动冒烟（非 tag 也跑） ----
      # nfpm 打包此前只在 tag 时执行，PR 上从未验证过「装得上、起得来」。
      # 前端产物复用 check-frontend 的 artifact，这里不再构建前端。
      # 跨发行版（Debian 13 / Fedora 40 / AlmaLinux 10）的依赖闭包实测在下面的
      # smoke-client-linux-install 矩阵，产物经 artifact 传下去。
      - name: 构建 production 二进制（供 nfpm 安装包）
        run: go build -tags production -trimpath -ldflags "-s -w -X main.version=smoke" -o build/bin/LiteTalk .
      # glibc 符号版本检查（issue #9）：构建基线 ubuntu-24.04 = glibc 2.39。
      # 产物引用的最高符号版本不得更高，否则静默抬高最低发行版要求。
      # 复用上面的 production 产物，不额外构建；检查前移到检查组后每次 push/PR 都跑
      # （打包 job 只在 tag 时运行，等价于发版前才发现基线被抬高）。
      - name: glibc 符号版本检查（不得超过 GLIBC_2.39）
        run: |
          set -o pipefail
          objdump -T build/bin/LiteTalk | grep -o 'GLIBC_[0-9.]*' | sort -uV | tee glibc-syms.txt
          max=$(tail -1 glibc-syms.txt)
          if [ -z "$max" ]; then
            echo "::error::objdump 未发现任何 glibc 符号——二进制或工具链异常"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$max" 'GLIBC_2.39' | sort -V | tail -1)" != "GLIBC_2.39" ]; then
            echo "::error::产物引用了 $max，超过构建基线 GLIBC_2.39"
            exit 1
          fi
          echo "glibc 检查通过（最高 $max）"
      - name: 安装 nfpm（锁版本）
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      # 本 job 也跑 nfpm（安装冒烟），所以同样需要许可证目录（#117）。
      - name: 生成第三方许可证目录
        run: bash build/third-party-licenses.sh build
      - name: 打 deb/rpm 并安装 deb（runner 侧闭包检查）
        run: |
          export VERSION=0.0.0
          export ARCH=amd64
          mkdir -p dist
          nfpm package --config build/nfpm.yaml --packager deb --target dist/
          # rpm 一并产出（nfpm 原生写 rpm，无需 rpmbuild）：供下面的
          # smoke-client-linux-install 矩阵在 Debian 13 / Fedora 40 /
          # AlmaLinux 10 容器里实测依赖闭包。与发版打包 job 同一份 nfpm 配置，
          # 仅内嵌版本号不同（这里固定 0.0.0），安装与启动行为一致。
          nfpm package --config build/nfpm.yaml --packager rpm --target dist/
          mv dist/*.rpm "dist/litetalk_${VERSION}_${ARCH}.rpm"
          deb="$(ls dist/litetalk_${VERSION}_${ARCH}.deb)"
          sudo dpkg -i "$deb"
          # 安装物一致性：.desktop 文件名 = ApplicationID（Wayland 按文件名
          # 匹配 app_id），StartupWMClass / Icon 同值，与 main.go 的
          # LinuxOptions.ApplicationID 对齐。
          desktop=/usr/share/applications/io.github.openalc.LiteTalk.desktop
          test -f "$desktop"
          test -x /usr/bin/litetalk
          test -f /usr/share/icons/hicolor/256x256/apps/io.github.openalc.LiteTalk.png
          grep -qx 'StartupWMClass=io.github.openalc.LiteTalk' "$desktop"
          grep -qx 'Icon=io.github.openalc.LiteTalk' "$desktop"
          desktop-file-validate "$desktop"
          # 第三方许可证必须真的进了包（#117）：静态链接 opus / APM 的二进制
          # 分发需要随附各许可证全文，缺一个就是合规漏发。
          doc=/usr/share/doc/litetalk/third-party
          test -f "$doc/THIRD-PARTY.md"
          for f in opus/COPYING opusfile/COPYING ogg/COPYING \
                   webrtc-apm/COPYING webrtc-apm/LICENSE.abseil; do
            test -f "$doc/$f" || { echo "::error::安装包缺少许可证 $f"; exit 1; }
          done
      - name: 启动冒烟断言负例（仅启动日志不得通过）
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          printf '=== LiteTalk smoke 启动 (pid=1) ===\n' > "$log"
          if bash build/linux/assert-smoke-ready.sh 124 "$log"; then
            echo '::error::缺少前端就绪标记却通过了启动冒烟'
            exit 1
          fi
          printf 'litetalk-smoke:frontend-ready\n' >> "$log"
          bash build/linux/assert-smoke-ready.sh 124 "$log"
      - name: 启动冒烟（Xvfb，10 秒）
        env:
          # 无 GPU 的 Xvfb 下关闭 WebKit 合成/DMABUF，避免软件渲染初始化失败
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          # WebKitGTK 6.0 的 bwrap 沙箱在无头 CI 上无法建立（无特权 user
          # namespace，bwrap 报 setting up uid map: Permission denied，xdg-dbus-proxy
          # 随之启动失败并 g_error 崩掉进程，退出码 2）。冒烟只验证安装闭包与
          # 启动存活，沙箱由用户真实桌面环境提供；GTK3 时代的 webkit2gtk-4.1
          # 无此问题（对比 dev 分支绿色冒烟日志）。
          WEBKIT_FORCE_SANDBOX: '0'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LITETALK_CI_SMOKE: '1'
        run: |
          set +e
          # dbus-run-session 必需：v3 单实例锁走会话总线，无总线时
          # application.New 直接 fatal（exit 1），与真实桌面环境不符。
          dbus-run-session -- xvfb-run -a timeout 10 litetalk > smoke.log 2>&1
          code=$?
          set -e
          cat smoke.log
          bash build/linux/assert-smoke-ready.sh "$code" smoke.log
      # deb/rpm 产物交给 smoke-client-linux-install 矩阵做四发行版闭包实测
      # （if: always()：启动冒烟失败时产物照样可取，容器矩阵可单独定位）。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-linux-packages
          path: client/dist/*
          if-no-files-found: ignore
          retention-days: 3

  # ---- #5 W3：四发行版容器安装冒烟（deb/rpm 依赖闭包实测，G2 数据来源） ----
  # 安装包复用 check-client-linux 的 artifact，这里不重复构建前端与 Go 侧。
  # 闭包结论以本矩阵为准：nfpm 声明的 Depends 必须能被各发行版自己的仓库解析；
  # RHEL 10 系需要 EPEL 10（WebKitGTK 6.0 只在 EPEL），由冒烟脚本显式启用并记录。
  # 容器失败时步骤日志含 dnf/apt 输出与启动日志，可读定位。
  smoke-client-linux-install:
    name: 安装冒烟（${{ matrix.distro }}）
    needs: check-client-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            pkg-type: deb
          - distro: debian-13
            image: debian:13
            pkg-type: deb
          - distro: fedora-40
            image: fedora:40
            pkg-type: rpm
          # RHEL 10 系代理选 almalinux:10：rockylinux 的 Docker Hub 官方镜像
          # 没有 10 这个 tag（manifest unknown，实测），almalinux 有 10/10.x。
          - distro: almalinux-10
            image: almalinux:10
            pkg-type: rpm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-linux-packages
          path: smoke-pkgs
      - name: 容器内安装并启动（${{ matrix.image }}）
        run: |
          docker run --rm \
            -v "$PWD/smoke-pkgs:/smoke/pkgs:ro" \
            -v "$PWD/client/build/linux/install-smoke.sh:/smoke/install-smoke.sh:ro" \
            -v "$PWD/client/build/linux/assert-smoke-ready.sh:/smoke/assert-smoke-ready.sh:ro" \
            -e PKG_TYPE=${{ matrix.pkg-type }} \
            "${{ matrix.image }}" \
            bash /smoke/install-smoke.sh

  # Windows：主力平台。真实 cgo Opus / DPAPI / WASAPI 路径只在这里被编译与测试
  check-client-windows:
    name: 客户端检查（Windows）
    needs: check-frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: go vet
        run: go vet ./...
      # 与 Linux 侧同一份清单（#117）：Windows 检查是真实 cgo 链接唯一被测试的
      # 地方，产物校验也必须在这里跑一次。
      - name: 第三方库产物校验（SHA256SUMS）
        run: cd third_party && sha256sum -c SHA256SUMS
      - name: go test（-race）
        run: go test -race -count=1 ./...
      - name: go build（production + GUI 子系统）
        run: go build -tags production -ldflags "-H=windowsgui" -o build/bin/LiteTalk.exe .

  # ======================= 打包组（仅 v* 标签） =======================

  package-server:
    name: 服务端打包（linux amd64 / arm64）
    if: startsWith(github.ref, 'refs/tags/v')
    # #50：check-frontend 产出 web-dist（base=/ 的 Web 客户端构建），编译前
    # 解到 server/internal/webui/dist/ 一起 embed。check-server 不下载——
    # 它编译 .gitkeep 占位版本，只验证 //go:embed 与静态路由可编译。
    needs: [check-tag, check-server, check-frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 交叉编译（CGO_ENABLED=0，注入版本号）
        working-directory: server
        run: |
          for arch in amd64 arm64; do
            mkdir -p ../dist/linux-$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/linux-$arch/litetalk-server ./cmd/server
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/linux-$arch/litetalk-updater ./cmd/updater
          done
      # 迁移已 embed 进二进制（migrations.FS），不再随包附带 migrations/ 目录
      # tar 内成员：litetalk-server（路径不变）+ litetalk-updater + update.sh（#97 一键升级）
      - name: 打包 tar.gz（二进制 + 更新器 + 升级脚本）
        run: |
          for arch in amd64 arm64; do
            cp server/deploy/update.sh dist/linux-$arch/update.sh
            tar -C dist/linux-$arch -czf dist/litetalk-server-linux-$arch.tar.gz \
              litetalk-server litetalk-updater update.sh
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server
          path: dist/*.tar.gz

  package-client-windows:
    name: Windows 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-client-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      # windows-latest 不保证 makensis 在 PATH：choco 安装后显式加入 NSIS 目录并验证
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") |
            Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) { throw "NSIS 安装后未找到 makensis.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          $env:PATH = "$nsisDir;$env:PATH"
          makensis /VERSION
      # 免 wails CLI：plain go build + 自包含 NSIS；-H=windowsgui 否则启动附带控制台窗口
      - name: 构建客户端（注入版本号）
        working-directory: client
        shell: pwsh
        run: |
          go build -tags production -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }} -H=windowsgui" `
            -o build/bin/LiteTalk.exe .
      # 第三方许可证（#117）：安装器与绿色版 zip 都在 client 目录下取
      # build/third-party，必须先于 makensis 生成。
      - name: 生成第三方许可证目录
        working-directory: client
        shell: pwsh
        run: |
          bash build/third-party-licenses.sh build
          if (-not (Test-Path "build/third-party/THIRD-PARTY.md")) {
            throw "第三方许可证目录未生成"
          }
      # 安装器版本从标签注入（去 v 前缀与测试标志，VIProductVersion 只接受纯数字）
      - name: 制作 NSIS 安装器
        working-directory: client/build/windows/installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v') -replace '-.*$',''
          makensis -DARG_WAILS_AMD64_BINARY="..\..\bin\LiteTalk.exe" -DINFO_PRODUCTVERSION="$ver" project.nsi
          if (-not (Test-Path "..\..\bin\LiteTalk-amd64-installer.exe")) {
            throw "makensis 未产出 LiteTalk-amd64-installer.exe"
          }
      - name: 整理产物（安装器 + 绿色版 zip）
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/LiteTalk-amd64-installer.exe dist/LiteTalk-windows-amd64-setup.exe
          # 第三方许可证（#117）：与安装器同源生成，解开 zip 即在
          # third-party\ 下得到各组件许可证全文。
          bash build/third-party-licenses.sh build
          # 绿色版：exe 与 third-party\ 同级打包，解压即可用、许可随之分发。
          $stage = "dist/portable"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/bin/LiteTalk.exe $stage
          Copy-Item -Recurse build/third-party $stage/third-party
          Remove-Item -Force dist/LiteTalk-windows-amd64-portable.zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath dist/LiteTalk-windows-amd64-portable.zip
          Remove-Item -Recurse -Force $stage
          # 许可证确实进包（#117）：zip 内保留 third-party\ 子目录。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/dist/LiteTalk-windows-amd64-portable.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' }
            if (-not ($names -contains 'third-party/THIRD-PARTY.md')) {
              throw "绿色版 zip 缺少 third-party/THIRD-PARTY.md"
            }
            if (-not ($names -contains 'third-party/webrtc-apm/LICENSE.abseil')) {
              throw "绿色版 zip 缺少 abseil 许可证"
            }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-windows
          path: client/dist/*

  # amd64 / arm64 共用矩阵；arm64 用原生 ARM runner（WebKitGTK cgo 交叉链脆弱）
  package-client-linux:
    name: Linux ${{ matrix.arch }} 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-client-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # 与 check-client-linux 同一批开发库：打包 job 也编译 hotkey_linux.go 的 cgo
      # （.desktop 静态校验已前移到 check-client-linux，不再在此重复）
      - name: 安装 GTK/WebKitGTK/X11 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libxi-dev
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: 安装 nfpm（锁版本）
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags production -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o build/bin/LiteTalk .
      # 第三方许可证随附目录（#117）：绿色版 tar 与 deb/rpm 共用这一份，
      # 由 build/third-party-licenses.sh 从 third_party/*/COPYING 生成。
      # 漏发许可证就是分发合规问题，所以生成失败直接中断打包。
      - name: 生成第三方许可证目录
        working-directory: client
        run: bash build/third-party-licenses.sh build
      - name: 绿色版 tar.gz
        working-directory: client
        run: |
          # 树内布局与 deb 安装后的路径一致：可执行文件在根，许可证在
          # share/doc/litetalk/third-party（#117）。
          rm -rf dist/staging
          mkdir -p dist/staging/share/doc/litetalk
          cp build/bin/LiteTalk dist/staging/litetalk
          cp -r build/third-party dist/staging/share/doc/litetalk/third-party
          tar -C dist/staging -czf dist/LiteTalk-linux-${ARCH}-portable.tar.gz \
            litetalk share/doc/litetalk/third-party
          rm -rf dist/staging
          # 许可证确实进包（#117）：tar 内布局与 deb 安装路径一致。
          tar -tzf dist/LiteTalk-linux-${ARCH}-portable.tar.gz | grep -qx \
            'share/doc/litetalk/third-party/THIRD-PARTY.md'
      # nfpm 的 ${ARCH} / ${VERSION} 从环境变量注入；deb/rpm 版本号去掉 v 前缀
      - name: deb / rpm（nfpm）
        working-directory: client
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --config build/nfpm.yaml --packager deb --target dist/
          nfpm package --config build/nfpm.yaml --packager rpm --target dist/
          mv dist/*.rpm "dist/litetalk_${VERSION}_${ARCH}.rpm"
          # GitHub 资产名会把 `~` 归一为 `.`，校验和必须使用上传安全的文件名（只改文件名，deb 内部 Debian 版本语义不动）
          for f in dist/*.deb; do
            want="dist/litetalk_${VERSION}_${ARCH}.deb"
            [ "$f" = "$want" ] || mv "$f" "$want"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-linux-${{ matrix.arch }}
          path: client/dist/*

  # 非阻塞：失败不影响 Release（release 的 if 不依赖本 job 结果）
  package-client-macos:
    name: macOS 客户端打包（非阻塞）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-frontend]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      # v3 免 wails CLI 无 .app bundle：产出裸二进制 zip（实验性）
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags production -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o build/bin/LiteTalk .
      - name: 打包 zip
        working-directory: client
        run: |
          mkdir -p dist
          cd build/bin && zip -r -X ../../dist/LiteTalk-macos-arm64.zip LiteTalk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-macos
          path: client/dist/*

  release:
    name: 发布 GitHub Release
    needs:
      - check-contract
      - check-mysql
      - smoke-client-linux-install
      - package-server
      - package-client-windows
      - package-client-linux
      - package-client-macos
    # always() 让 macOS 失败不阻断；显式要求所有阻塞 job（含安装冒烟）为 success
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.check-contract.result == 'success' &&
      needs.check-mysql.result == 'success' &&
      needs.smoke-client-linux-install.result == 'success' &&
      needs.package-server.result == 'success' &&
      needs.package-client-windows.result == 'success' &&
      needs.package-client-linux.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 汇总全部打包产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 创建 Release（draft，先传完资产）
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 先建 draft：资产上传完成前不触发 published，更新器收到的第一个 published
          # 事件就带完整资产（更新器仍保留 12×5s 晚到重试）。
          draft: true
          # -alpha / -beta / -rc 标签标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
      # 资产全部上传后再发布。本步失败则 Release 停留在 draft：需手工发布或重跑本 job；
      # 已发布后重跑只会产生 edited 事件（更新器忽略），此时靠 Redeliver 或 SSH 兜底。
      - name: 发布 Release（draft → published）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"

  # SSH 兜底（#97）：webhook 投递不稳时经 SSH 调服务器上的 update.sh --tag <tag>。
  # DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER 任一缺失即跳过（不阻塞 release）；
  # 本 job 在 release 之后运行且 continue-on-error，失败不影响发布结果。
  deploy-ssh:
    name: SSH 兜底触发服务器更新（可选）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: 检查 DEPLOY_* secrets
        id: chk
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER 不全，跳过 SSH 兜底"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH 调用 update.sh --tag
        if: steps.chk.outputs.skip == 'false'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_UPDATE_PATH: ${{ vars.DEPLOY_UPDATE_PATH }}
        run: |
          # tag 与脚本路径都过白名单正则后才进远程命令，杜绝命令注入
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc))?$ ]]; then
            echo "::error::tag 不符合版本规范: $GITHUB_REF_NAME"
            exit 1
          fi
          script="${DEPLOY_UPDATE_PATH:-/www/wwwroot/LiteTalk/update.sh}"
          if ! [[ "$script" =~ ^/[A-Za-z0-9/_.-]+$ ]]; then
            echo "::error::DEPLOY_UPDATE_PATH 形态非法: $script"
            exit 1
          fi
          # 预发布 tag 要 --allow-prerelease：tag 已被上面的正则锁成封闭字符集，
          # 这里追加的是固定字面量，不构成注入面。
          allow=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            allow=" --allow-prerelease"
          fi
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          set +e
          ssh -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$script' --tag '$GITHUB_REF_NAME'$allow"
          rc=$?
          set -e
          # 75 = 更新器跨进程锁被占用（webhook 已在跑同一次更新）：视为已覆盖，不算失败
          if [ "$rc" -eq 75 ]; then
            echo "::notice::服务器已有更新在运行，跳过 SSH 兜底"
            exit 0
          fi
          exit "$rc"
