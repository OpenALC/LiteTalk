# 轻音 LiteTalk CI/CD（流程规范见仓库根 CLAUDE.md「CI 门禁」一节）
#
# 触发：
#   - push 分支 / pull_request / workflow_dispatch → 只跑「检查组」（全部阻塞）
#   - push v* 标签 → 检查组 + 打包组 + 发布 Release
# 阻塞性：检查组全部阻塞；打包组中 macOS 非阻塞（continue-on-error，且 release 条件不依赖其结果）。
#
# 注：本机开发（国内）Go 走 goproxy.cn、前端走项目级 .npmrc 的 npmmirror；
#     CI runner 在境外，Go/npm 均保持默认源。
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
    # 纯文档提交不跑 CI（paths 过滤对标签推送不生效，发版不受影响）
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# 同一 ref 的新提交取消旧检查；标签发版永不取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'
  NFPM_VERSION: 'v2.48.0'

jobs:
  # ======================= 检查组（每次 push / PR，全部阻塞） =======================

  # 版本规范：v<大>.<功能>.<修复>[-alpha|-beta|-rc]，禁止测试标志后加序号
  check-tag:
    name: 标签格式
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: 校验 ${{ github.ref_name }}
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc))?$ ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 不符合 v<大>.<功能>.<修复>[-alpha|-beta|-rc]"
            exit 1
          fi

  check-server:
    name: 服务端检查
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::以下文件未 gofmt："; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test（-race）
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...

  # 前端只在这里构建一次，dist 以 artifact 分发给客户端检查与各打包 job
  check-frontend:
    name: 前端检查
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本由 client/frontend/package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查（vue-tsc）
        run: pnpm run type-check
      - name: 单元测试（vitest）
        run: pnpm test
      - name: 构建
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
          retention-days: 3

  # Linux：gtk3 标签（v3 内部 cgo 包不受 server 标签豁免，勿用 server 标签做检查）
  check-client-linux:
    name: 客户端检查（Linux）
    needs: check-frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      # libx11-dev / libxi-dev 供 client/internal/hotkey/hotkey_linux.go 的 cgo 用
      # （X11 + XInput2 raw 事件）。只是构建期开发库：libX11.so.6 / libXi.so.6 运行
      # 时已由 libgtk-3-0 传递依赖，nfpm 的 depends 不用动。
      # desktop-file-utils 供 litetalk.desktop 静态校验（issue #6），前移到检查
      # job：不依赖构建产物，dev 期间每次 push 都能发现打包期才暴露的问题。
      - name: 安装 GTK/WebKitGTK/libopus/X11/desktop-file 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libopus-dev libx11-dev libxi-dev desktop-file-utils
      - name: desktop-file-validate（.desktop 静态校验）
        run: desktop-file-validate build/linux/litetalk.desktop
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "::error::以下文件未 gofmt："; echo "$out"; exit 1; fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet -tags gtk3 ./...
      - name: go test（-race）
        run: go test -tags gtk3 -race -count=1 ./...
      - name: go build
        run: go build -tags gtk3 ./...

  # Windows：主力平台。真实 cgo Opus / DPAPI / WASAPI 路径只在这里被编译与测试
  check-client-windows:
    name: 客户端检查（Windows）
    needs: check-frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test（-race）
        run: go test -race -count=1 ./...
      - name: go build（production + GUI 子系统）
        run: go build -tags production -ldflags "-H=windowsgui" -o build/bin/LiteTalk.exe .

  # ======================= 打包组（仅 v* 标签） =======================

  package-server:
    name: 服务端打包（linux amd64 / arm64）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: 交叉编译（CGO_ENABLED=0，注入版本号）
        working-directory: server
        run: |
          for arch in amd64 arm64; do
            mkdir -p ../dist/linux-$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/linux-$arch/litetalk-server ./cmd/server
          done
      # 迁移已 embed 进二进制（migrations.FS），不再随包附带 migrations/ 目录
      - name: 打包 tar.gz（仅二进制）
        run: |
          for arch in amd64 arm64; do
            tar -C dist/linux-$arch -czf dist/litetalk-server-linux-$arch.tar.gz litetalk-server
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server
          path: dist/*.tar.gz

  package-client-windows:
    name: Windows 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-client-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      # windows-latest 不保证 makensis 在 PATH：choco 安装后显式加入 NSIS 目录并验证
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") |
            Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) { throw "NSIS 安装后未找到 makensis.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          $env:PATH = "$nsisDir;$env:PATH"
          makensis /VERSION
      # 免 wails CLI：plain go build + 自包含 NSIS；-H=windowsgui 否则启动附带控制台窗口
      - name: 构建客户端（注入版本号）
        working-directory: client
        shell: pwsh
        run: |
          go build -tags production -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }} -H=windowsgui" `
            -o build/bin/LiteTalk.exe .
      # 安装器版本从标签注入（去 v 前缀与测试标志，VIProductVersion 只接受纯数字）
      - name: 制作 NSIS 安装器
        working-directory: client/build/windows/installer
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v') -replace '-.*$',''
          makensis -DARG_WAILS_AMD64_BINARY="..\..\bin\LiteTalk.exe" -DINFO_PRODUCTVERSION="$ver" project.nsi
          if (-not (Test-Path "..\..\bin\LiteTalk-amd64-installer.exe")) {
            throw "makensis 未产出 LiteTalk-amd64-installer.exe"
          }
      - name: 整理产物（安装器 + 绿色版 zip）
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/LiteTalk-amd64-installer.exe dist/LiteTalk-windows-amd64-setup.exe
          Compress-Archive -Path build/bin/LiteTalk.exe -DestinationPath dist/LiteTalk-windows-amd64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-windows
          path: client/dist/*

  # amd64 / arm64 共用矩阵；arm64 用原生 ARM runner（WebKitGTK cgo 交叉链脆弱）
  package-client-linux:
    name: Linux ${{ matrix.arch }} 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-client-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # 与 check-client-linux 同一批开发库：打包 job 也编译 hotkey_linux.go 的 cgo
      # （.desktop 静态校验已前移到 check-client-linux，不再在此重复）
      - name: 安装 GTK/WebKitGTK/libopus/X11 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libopus-dev libx11-dev libxi-dev
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: 安装 nfpm（锁版本）
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags gtk3,production -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o build/bin/LiteTalk .
      # glibc 符号版本检查（issue #9）：构建基线 ubuntu-24.04 = glibc 2.39。
      # 产物引用的最高符号版本不得更高，否则静默抬高最低发行版要求。
      - name: glibc 符号版本检查（不得超过 GLIBC_2.39）
        working-directory: client
        run: |
          set -o pipefail
          objdump -T build/bin/LiteTalk | grep -o 'GLIBC_[0-9.]*' | sort -uV | tee glibc-syms.txt
          max=$(tail -1 glibc-syms.txt)
          if [ -z "$max" ]; then
            echo "::error::objdump 未发现任何 glibc 符号——二进制或工具链异常"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$max" 'GLIBC_2.39' | sort -V | tail -1)" != "GLIBC_2.39" ]; then
            echo "::error::产物引用了 $max，超过构建基线 GLIBC_2.39"
            exit 1
          fi
          echo "glibc 检查通过（最高 $max）"
      - name: 绿色版 tar.gz
        working-directory: client
        run: |
          mkdir -p dist
          tar -C build/bin -czf dist/LiteTalk-linux-${ARCH}-portable.tar.gz LiteTalk
      # nfpm 的 ${ARCH} / ${VERSION} 从环境变量注入；deb/rpm 版本号去掉 v 前缀
      - name: deb / rpm（nfpm）
        working-directory: client
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          nfpm package --config build/nfpm.yaml --packager deb --target dist/
          nfpm package --config build/nfpm.yaml --packager rpm --target dist/
          mv dist/*.rpm "dist/litetalk_${VERSION}_${ARCH}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-linux-${{ matrix.arch }}
          path: client/dist/*

  # 非阻塞：失败不影响 Release（release 的 if 不依赖本 job 结果）
  package-client-macos:
    name: macOS 客户端打包（非阻塞）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-tag, check-frontend]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/frontend/dist
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      # v3 免 wails CLI 无 .app bundle：产出裸二进制 zip（实验性）
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags production -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o build/bin/LiteTalk .
      - name: 打包 zip
        working-directory: client
        run: |
          mkdir -p dist
          cd build/bin && zip -r -X ../../dist/LiteTalk-macos-arm64.zip LiteTalk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-macos
          path: client/dist/*

  release:
    name: 发布 GitHub Release
    needs:
      - package-server
      - package-client-windows
      - package-client-linux
      - package-client-macos
    # always() 让 macOS 失败不阻断；显式要求所有阻塞打包 job 为 success
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.package-server.result == 'success' &&
      needs.package-client-windows.result == 'success' &&
      needs.package-client-linux.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 汇总全部打包产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # -alpha / -beta / -rc 标签标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
