# 轻音 LiteTalk CI/CD
# 单共享工作流：push / workflow_dispatch 只做检查；推送 v* 标签追加打包与 GitHub Release 发版。
#
# 注：本机开发（国内）Go 模块代理用 goproxy.cn（go env -w GOPROXY=https://goproxy.cn,direct），
#     前端走项目级 .npmrc 的 npmmirror；CI runner 在境外，Go/npm 均保持默认源。
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'

jobs:
  # ---------------- 日常检查（每次 push 都跑） ----------------

  check-server:
    name: 服务端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # 服务端 M0 零第三方依赖、无 go.sum，关闭缓存
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...

  check-client:
    name: 客户端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Wails v3 Linux 构建（含 server 标签下的 cgo 内部包）走 pkg-config：
      # gtk3 标签对应 gtk+-3.0/webkit2gtk-4.1，与 v2 webkit2_41 同一套 apt 依赖
      - name: 安装 GTK/WebKitGTK 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # pnpm 版本由 client/frontend/package.json 的 packageManager 字段决定
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: client/frontend
        run: pnpm install --frozen-lockfile
      # main.go 中 //go:embed all:frontend/dist 依赖产物，前端构建必须在 go vet 之前
      - name: 构建前端
        working-directory: client/frontend
        run: pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - name: go vet
        working-directory: client
        run: go vet -tags gtk3 ./...
      - name: go test
        working-directory: client
        run: go test -tags gtk3 ./...
      - name: go build
        working-directory: client
        run: go build -tags gtk3 ./...

  # ---------------- 打包发版（仅 v* 标签） ----------------

  package-server:
    name: 服务端打包（linux amd64 / arm64）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: 交叉编译（CGO_ENABLED=0，注入版本号）
        working-directory: server
        run: |
          mkdir -p ../dist/linux-amd64 ../dist/linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/linux-amd64/litetalk-server ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o ../dist/linux-arm64/litetalk-server ./cmd/server
      - name: 打包 tar.gz
        working-directory: dist
        run: |
          tar -C linux-amd64 -czf litetalk-server-linux-amd64.tar.gz litetalk-server
          tar -C linux-arm64 -czf litetalk-server-linux-arm64.tar.gz litetalk-server
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server
          path: dist/*.tar.gz

  package-client-windows:
    name: Windows 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: client/frontend
        run: pnpm install --frozen-lockfile
      # windows-latest 不保证 makensis 在 PATH：choco 安装后显式加入 NSIS 目录并验证
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisDir = @("C:\Program Files (x86)\NSIS", "C:\Program Files\NSIS") |
            Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsisDir) { throw "NSIS 安装后未找到 makensis.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          $env:PATH = "$nsisDir;$env:PATH"
          makensis /VERSION
      # Wails v3：免 wails CLI——plain go build（CGO/WebView2 同 v2 工具链）+ 自包含 NSIS 脚本
      - name: 构建客户端（注入版本号）
        working-directory: client
        shell: pwsh
        run: |
          go build -tags production -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" `
            -o build/bin/LiteTalk.exe .
      - name: 制作 NSIS 安装器
        working-directory: client/build/windows/installer
        shell: pwsh
        run: |
          makensis -DARG_WAILS_AMD64_BINARY="..\..\bin\LiteTalk.exe" project.nsi
          if (-not (Test-Path "..\..\bin\LiteTalk-amd64-installer.exe")) {
            throw "makensis 未产出 LiteTalk-amd64-installer.exe"
          }
      - name: 整理产物（安装器 + 绿色版 zip）
        working-directory: client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 安装器产物名固定为 LiteTalk-amd64-installer.exe（自包含 project.nsi 的 OutFile）
          $installer = Get-ChildItem build/bin/*-installer.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Host "build/bin 内容："
            Get-ChildItem build/bin | Format-Table Name, Length
            throw "未找到 *-installer.exe"
          }
          Write-Host "安装器: $($installer.Name)"
          Copy-Item $installer.FullName dist/LiteTalk-windows-amd64-setup.exe
          Compress-Archive -Path build/bin/LiteTalk.exe -DestinationPath dist/LiteTalk-windows-amd64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-windows
          path: client/dist/*

  package-client-linux-amd64:
    name: Linux amd64 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - name: 安装 GTK/WebKitGTK 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装 nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: 安装前端依赖
        working-directory: client/frontend
        run: pnpm install --frozen-lockfile
      # Wails v3：gtk3 构建标签对应 WebKitGTK 4.1（同 v2 webkit2_41 的 apt 依赖）
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags gtk3,production -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o build/bin/LiteTalk .
      - name: 绿色版 tar.gz
        working-directory: client
        run: |
          mkdir -p dist
          tar -C build/bin -czf dist/LiteTalk-linux-amd64-portable.tar.gz LiteTalk
      # nfpm 的 ${ARCH} / ${VERSION} 从环境变量注入；deb/rpm 版本号去掉 v 前缀
      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # deb 惯例命名 litetalk_<ver>_<arch>.deb 已符合 §14.4；
      # rpm 惯例命名为 litetalk-<ver>-1.<rpm-arch>.rpm，重命名为 litetalk_<ver>_<arch>.rpm
      - name: deb / rpm（nfpm）
        working-directory: client
        run: |
          nfpm package --config build/nfpm.yaml --packager deb --target dist/
          nfpm package --config build/nfpm.yaml --packager rpm --target dist/
          mv dist/*.rpm "dist/litetalk_${VERSION}_${ARCH}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-linux-amd64
          path: client/dist/*

  package-client-linux-arm64:
    name: Linux arm64 客户端打包
    if: startsWith(github.ref, 'refs/tags/v')
    # WebKitGTK CGo 交叉链脆弱，使用 ARM 原生 runner
    runs-on: ubuntu-24.04-arm
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - name: 安装 GTK/WebKitGTK 开发库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装 nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: 安装前端依赖
        working-directory: client/frontend
        run: pnpm install --frozen-lockfile
      # Wails v3：gtk3 构建标签对应 WebKitGTK 4.1（ARM runner 同样 apt 依赖）
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags gtk3,production -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o build/bin/LiteTalk .
      - name: 绿色版 tar.gz
        working-directory: client
        run: |
          mkdir -p dist
          tar -C build/bin -czf dist/LiteTalk-linux-arm64-portable.tar.gz LiteTalk
      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: deb / rpm（nfpm）
        working-directory: client
        run: |
          nfpm package --config build/nfpm.yaml --packager deb --target dist/
          nfpm package --config build/nfpm.yaml --packager rpm --target dist/
          mv dist/*.rpm "dist/litetalk_${VERSION}_${ARCH}.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-linux-arm64
          path: client/dist/*

  package-client-macos:
    name: macOS 客户端打包（非阻塞）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    # 非阻塞项：失败不影响整体结果与发版
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: client/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/frontend/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: client/frontend
        run: pnpm install --frozen-lockfile
      # Wails v3：免 wails CLI——plain go build。
      # 注意：v3 无 .app bundle 打包（原 wails CLI 产物），此处产出裸二进制 zip（该 job 本为非阻塞）。
      - name: 构建客户端（注入版本号）
        working-directory: client
        run: |
          go build -tags production -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o build/bin/LiteTalk .
      - name: 打包 zip
        working-directory: client
        run: |
          mkdir -p dist
          cd build/bin && zip -r -X ../../dist/LiteTalk-macos-arm64.zip LiteTalk
      - uses: actions/upload-artifact@v4
        with:
          name: dist-client-macos
          path: client/dist/*

  release:
    name: 发布 GitHub Release
    needs:
      - package-server
      - package-client-windows
      - package-client-linux-amd64
      - package-client-linux-arm64
      - package-client-macos
    # always() 保证 macOS（continue-on-error）失败不阻断；
    # 显式检查 4 个阻塞打包 job：Windows / Linux / 服务端任一失败则不发版
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.package-server.result == 'success' && needs.package-client-windows.result == 'success' && needs.package-client-linux-amd64.result == 'success' && needs.package-client-linux-arm64.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总全部打包产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
