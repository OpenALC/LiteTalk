          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/channels/{id}/members/{user_id}/server-mute:
    put:
      operationId: setServerMuted
      summary: 服务端强制闭麦/解禁（需 MuteMembers，#36）
      description: >
        服务端在 SFU 转发前丢弃目标的上行 RTP（track 保持挂载），目标不配合也无法
        绕过；房间成员收到 voice.state{server_muted}。仅语音频道；不能对自己操作；
        非 owner 只能对角色层级严格低于自己的成员操作（与角色管理同口径）。
        code：bad_channel、bad_request、路径参数不合法；401；403 forbidden；
        404 not_found（频道不存在、目标不是成员或不在该频道语音房）；5xx internal。
      tags: [channels]
      parameters:
        - $ref: '#/components/parameters/IDPath'
        - $ref: '#/components/parameters/UserIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerMuteRequest'
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录签发的 access_token（Authorization: Bearer <token>）'
  parameters:
    IDPath:
      name: id
      in: path
      required: true
      description: 资源 ID 的十进制数字串（URL 无精度问题；JSON 体里 ID 一律字符串）
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIDPath:
      name: user_id
      in: path
      required: true
      description: 目标用户 ID 的十进制数字串（#35 B4）
      schema:
        type: integer
        format: int64
        minimum: 1
    TargetTypePath:
      name: target_type
      in: path
      required: true
      description: 频道覆盖的目标类型（#35 B4）
      schema:
        type: string
        enum: [role, member]
    TargetIDPath:
      name: target_id
      in: path
      required: true
      description: 覆盖目标（角色或成员）ID 的十进制数字串（#35 B4）
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 请求不合法（body.code：bad_request / too_large / 各操作专属校验码）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: >
        未登录或令牌失效（body.code：unauthorized / session_replaced /
        session_replayed / bad_credentials）。session_* 另带响应头 X-LiteTalk-Auth。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 无权操作（body.code：forbidden / guest_disabled / reset_unavailable 等）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在（body.code：not_found / bad_code 等）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 资源冲突（body.code：conflict / email_taken / already_friends / request_exists / bad_state / code_exhausted / category_not_empty 等）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 已过期（body.code：code_expired）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 触发限流（body.code：rate_limited）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClientUpgradeRequired:
      description: >
        客户端版本过旧（body.code：client_too_old）。服务端要求请求头
        X-LiteTalk-Client 不低于 1.5；缺失或更低版本的 /auth/* 请求被拒绝。
        message 与 detail 同值，旧客户端可直接显示升级提示。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: 方法不允许（body.code：method_not_allowed）；响应头 Allow 列出该路径的可用方法。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TurnUnavailable:
      description: TURN 未配置或暂不可用（body.code：turn_unavailable）；客户端按直连降级。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: 服务端错误（body.code：internal / conflict / not_found / code_expired，store 错误映射）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Attachment:
      type: object
      title: Attachment
      description: >
        附件元数据（#31 预留 schema 占位，实现移出本批另单跟踪）。
        计划端点：POST /api/v1/attachments（multipart，登录可传）返回本结构，
        消息体以 attachment_ids 引用；存储后端可插拔（本地磁盘 / S3 兼容）。
        本批不实现端点，字段形状以实现落地时为准。
      required: [id, filename, size, content_type]
      properties:
        id:
          type: string
          description: 附件 ID（十进制字符串）
        filename:
          type: string
        size:
          type: integer
          format: int64
          description: 字节数
        content_type:
          type: string
    Problem:
      type: object
      title: Problem
      description: >
        RFC 9457 问题详情（application/problem+json，#31）。code 为扩展字段
        （机器可读错误码，客户端依赖，字符串码与旧版一致）；detail 为本次出错
        的中文提示。message 与 detail 同值，是兼容旧客户端的提示字段
        （RFC 9457 允许的扩展字段，至少保留一个版本）。
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          description: 问题类型 URI（urn:litetalk:error:<code>）
        title:
          type: string
          description: 问题类型摘要（随 status 定，不随实例变）
        status:
          type: integer
          format: int32
          description: HTTP 状态码（与响应行一致）
        code:
          type: string
          description: 机器可读错误码（扩展字段）
        detail:
          type: string
          description: 本次出错的中文提示
        message:
          type: string
          description: 兼容旧客户端的提示字段（与 detail 同值，至少保留一个版本）
    StatusOk:
      type: object
      title: StatusOk
      description: 删除/吊销类操作的固定成功体。
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Healthz:
      type: object
      title: Healthz
      description: 部署探活响应。路径与方法被部署脚本依赖，不得变更。
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: 服务端构建版本（未注入版本号的本地构建为 dev）
    ICEServer:
      type: object
      title: ICEServer
      description: 单条 ICE server（字段与 WebRTC RTCIceServer 对齐）。
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
          description: 'stun:/stuns:/turn:/turns: URL 列表'
        username:
          type: string
          description: TURN 短期用户名（<expiry_unix>:<uid>）；STUN 条目无此字段
        credential:
          type: string
          description: TURN 短期凭证（HMAC-SHA1 base64）；STUN 条目无此字段
    RtcCredentials:
      type: object
      title: RtcCredentials
      description: TURN/STUN 短期凭证；iceServers 可直接填入 WebRTC 配置。
      required: [iceServers, expiresAt]
      properties:
        iceServers:
          type: array
          items:
            $ref: '#/components/schemas/ICEServer'
        expiresAt:
          type: integer
          format: int64
          description: 凭证过期时刻（unix 秒）
    ServerConfig:
      type: object
      title: ServerConfig
      required: [auth_mode, mail_configured, self_host, bootstrap_required]
      properties:
        auth_mode:
          type: string
          enum: [full, simple]
        mail_configured:
          type: boolean
          description: 发信通道为真实投递（非 Console 打印）
        self_host:
          type: boolean
          description: 一键自托管形态（SQLite/进程内单机部署）
        bootstrap_required:
          type: boolean
          description: 管理员邀请码未消费（注册页提示等待管理员邀请）
    User:
      type: object
      title: User
      description: 自响应用户（/users/me、登录/注册/游客/刷新），含 email。ID 为十进制字符串（#31）。
      required: [id, email, nickname, tag, email_verified, is_guest, status, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: ID
        email:
          type: string
        nickname:
          type: string
        tag:
          type: string
          description: 四位定宽数字串
        email_verified:
          type: boolean
        is_guest:
          type: boolean
        status:
          type: integer
          format: int32
          description: 账号状态枚举
        created_at:
          type: string
          format: date-time
          x-go-type: Time
        updated_at:
          type: string
          format: date-time
          x-go-type: Time
    PublicUser:
      type: object
      title: PublicUser
      description: 对外用户视图（好友/成员等他人信息），不含 email。ID 为十进制字符串（#31）。
      required: [id, nickname, tag, email_verified, is_guest, status, online, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: ID
        nickname:
          type: string
        tag:
          type: string
        email_verified:
          type: boolean
        is_guest:
          type: boolean
        status:
          type: integer
          format: int32
        online:
          type: boolean
          description: 在线态（presence）；仅已接受好友关系填真实值（成员视图用 MemberInfo.online），其余恒 false
        created_at:
          type: string
          format: date-time
          x-go-type: Time
        updated_at:
          type: string
          format: date-time
          x-go-type: Time
    TokenPair:
      type: object
      title: TokenPair
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: access_token 有效期（秒）
        user:
          $ref: '#/components/schemas/User'
    ServerInfo:
      type: object
      title: ServerInfo
      description: 服务器（群组）。图标为预设 Lucide 图标名 + 颜色，无图片。ID 为十进制字符串（#31）。
      required: [id, name, owner_id, icon_name, icon_color, created_at]
      properties:
        id:
          type: string
          x-go-type: ID
        name:
          type: string
        owner_id:
          type: string
          x-go-type: ID
        icon_name:
          type: string
        icon_color:
          type: string
          description: '#RRGGBB'
        created_at:
          type: string
          format: date-time
          x-go-type: Time
    ChannelInfo:
      type: object
      title: ChannelInfo
      description: 频道。ID 为十进制字符串（#31）。
      required: [id, server_id, name, type, category_id, position, created_at]
      properties:
        id:
          type: string
          x-go-type: ID
        server_id:
          type: string
          x-go-type: ID
        name:
          type: string
        type:
          type: string
          enum: [text, voice]
        category_id:
          type: string
          nullable: true
          x-go-type: ID
          description: 分类归属；null = 未分类（请求侧 0 也表示未分类）
        position:
          type: integer
        created_at:
          type: string
          format: date-time
          x-go-type: Time
        parent_id:
          type: string
          nullable: true
          x-go-type: ID
          description: 父频道 ID（#37 子频道树，仅语音频道）；null = 顶层。可选属性，服务端始终返回
        has_password:
          type: boolean
          description: 是否设有频道密码（#37）；密码明文/哈希永不回显。可选属性，服务端始终返回
        user_limit:
          type: integer
          description: 语音人数上限（#37）；0 = 不限。可选属性，服务端始终返回
    CategoryInfo:
      type: object
      title: CategoryInfo
      description: 频道分类。ID 为十进制字符串（#31）。
      required: [id, server_id, name, position, created_at]
      properties:
        id:
          type: string
          x-go-type: ID
        server_id:
          type: string
          x-go-type: ID
        name:
          type: string
        position:
          type: integer
        created_at:
          type: string
          format: date-time
          x-go-type: Time
    MemberInfo:
      type: object
      title: MemberInfo
      description: 服务器成员（内联昵称/tag，含在线态）。ID 为十进制字符串（#31）。
      required: [server_id, user_id, role, joined_at, online]
      properties:
        server_id:
          type: string
          x-go-type: ID
        user_id:
          type: string
          x-go-type: ID
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time
          x-go-type: Time
        nickname:
          type: string
        tag:
          type: string
        online:
          type: boolean
          description: 在线态（presence:{uid} 存在即在线）；不依赖好友关系
        role_ids:
          type: array
          description: 成员持有的角色 ID（含 @everyone；可选，旧响应缺省不回）
          items:
            type: string
            x-go-type: ID
    Message:
      type: object
      title: Message
      description: 文字频道消息（发送者昵称/tag 内联，不含邮箱）。ID 为十进制字符串（#31）。
      required: [id, channel_id, user_id, content, created_at]
      properties:
        id:
          type: string
          x-go-type: ID
        channel_id:
          type: string
          x-go-type: ID
        user_id:
          type: string
          x-go-type: ID
        content:
          type: string
        nonce:
          type: string
          description: 幂等键（#31）；未带 nonce 的消息无此字段
        created_at:
          type: string
          format: date-time
          x-go-type: Time
        sender_nickname:
          type: string
        sender_tag:
          type: string
    Invite:
      type: object
      title: Invite
      description: 邀请码。ID 为十进制字符串（#31）。
      required: [code, server_id, creator_id, max_uses, uses]
      properties:
        code:
          type: string
        server_id:
          type: string
          x-go-type: ID
        creator_id:
          type: string
          x-go-type: ID
        max_uses:
          type: integer
          description: 0 = 不限
        uses:
          type: integer
        expires_at:
          type: string
          format: date-time
          x-go-type: Time
          nullable: true
    FriendEntry:
      type: object
      title: FriendEntry
      description: >
        好友条目。remark/group 仅发起方视角非空（被请求方恒空串）。
        user 为 PublicUser（无 email）。
      required: [id, status, incoming, remark, group, user]
      properties:
        id:
          type: string
          x-go-type: ID
          description: 关系行 ID（请求数）
        status:
          type: string
          enum: [pending, accepted, blocked]
        incoming:
          type: boolean
          description: true = 对端发起（我是被请求方）
        remark:
          type: string
        group:
          type: string
        user:
          description: 对端 PublicUser；对端查询失败时为 null（仅 accept/patch 极端情况）
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PublicUser'
    ServerChannels:
      type: object
      title: ServerChannels
      description: 分类与频道两数组（空为 []，非 null）。
      required: [categories, channels]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryInfo'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelInfo'
    SyncServer:
      type: object
      title: SyncServer
      description: 聚合快照中的服务器：ServerInfo 字段平铺 + 分类与频道（空为 []，非 null）。
      allOf:
        - $ref: '#/components/schemas/ServerInfo'
        - type: object
          required: [categories, channels]
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategoryInfo'
            channels:
              type: array
              items:
                $ref: '#/components/schemas/ChannelInfo'
    SyncSnapshot:
      type: object
      title: SyncSnapshot
      description: >
        续传失败后的聚合快照（#78）。servers 只含调用者为成员的服务器与其频道；
        friends 的 user 为 PublicUser（不含 email），online 对已接受关系为真实在线态。
      required: [servers, friends]
      properties:
        servers:
          type: array
          items:
            $ref: '#/components/schemas/SyncServer'
        friends:
          type: array
          items:
            $ref: '#/components/schemas/FriendEntry'
    RegisterRequest:
      type: object
      title: RegisterRequest
      required: [nickname, email, password]
      properties:
        nickname:
          type: string
          description: 2–16 字符
        email:
          type: string
        password:
          type: string
          description: 8–72 字节
        code:
          type: string
          description: 邮箱验证码（simple 模式忽略）
        device:
          type: string
          description: 设备类型 desktop/mobile；空 = desktop
        bootstrap:
          type: string
          description: 管理员邀请码（可选；空 = 不使用）
    LoginRequest:
      type: object
      title: LoginRequest
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
        device:
          type: string
    GuestRequest:
      type: object
      title: GuestRequest
      description: 请求体可为空（老客户端兼容）。
      properties:
        device:
          type: string
    RefreshRequest:
      type: object
      title: RefreshRequest
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      title: LogoutRequest
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    EmailCodeRequest:
      type: object
      title: EmailCodeRequest
      required: [email, purpose]
      properties:
        email:
          type: string
        purpose:
          type: string
          enum: [register, reset]
    PasswordResetRequest:
      type: object
      title: PasswordResetRequest
      required: [email, code, password]
      properties:
        email:
          type: string
        code:
          type: string
        password:
          type: string
    PatchMeRequest:
      type: object
      title: PatchMeRequest
      x-go-type: PatchMeBody
      description: >
        JSON Merge Patch（RFC 7396，#31）：缺省 = 不改，null = 清空（昵称不可清，
        空值被校验拒 400），值 = 设置。部分更新（当前仅 nickname）。
      properties:
        nickname:
          type: string
          nullable: true
    AddFriendRequest:
      type: object
      title: AddFriendRequest
      description: nickname 可写成「昵称#tag」整体；分开传则 tag 为 4 位。
      required: [nickname]
      properties:
        nickname:
          type: string
        tag:
          type: string
    PatchFriendRequest:
      type: object
      title: PatchFriendRequest
      x-go-type: PatchFriendBody
      description: >
        JSON Merge Patch（RFC 7396，#31）：缺省 = 不改，null/空串 = 清除备注/
        移出分组，值 = 设置。仅发起方向可写。
      properties:
        remark:
          type: string
          nullable: true
          description: 0–64 字符
        group:
          type: string
          nullable: true
          description: 0–32 字符
    CreateServerRequest:
      type: object
      title: CreateServerRequest
      required: [name]
      properties:
        name:
          type: string
          description: 2–32 字符
        icon_name:
          type: string
          description: 预设 Lucide 图标名；空 = messages-square
        icon_color:
          type: string
          description: '#RRGGBB；空 = #4FA4F3'
    PatchServerRequest:
      type: object
      title: PatchServerRequest
      x-go-type: PatchServerBody
      description: >
        JSON Merge Patch（RFC 7396，#31）：缺省 = 不改，null = 清空（名称/图标
        不可清，空值被校验拒 400），值 = 设置。
      properties:
        name:
          type: string
          nullable: true
        icon_name:
          type: string
          nullable: true
        icon_color:
          type: string
          nullable: true
    JoinServerRequest:
      type: object
      title: JoinServerRequest
      required: [code]
      properties:
        code:
          type: string
    CreateInviteRequest:
      type: object
      title: CreateInviteRequest
      description: 请求体仍需为 JSON 对象；两字段缺省按 0 处理。
      properties:
        max_uses:
          type: integer
          description: 0 = 不限；不可为负
        expires_in:
          type: integer
          format: int64
          description: 秒；0 = 不过期
    CreateChannelRequest:
      type: object
      title: CreateChannelRequest
      required: [name, type]
      properties:
        name:
          type: string
          description: 1–64 字符
        type:
          type: string
          enum: [text, voice]
        category_id:
          type: string
          nullable: true
          x-go-type: ID
          description: 0/缺省 = 未分类；请求侧数字与字符串双接受（#31）
        position:
          type: integer
        password:
          type: string
          writeOnly: true
          description: 频道密码（#37，1–72 字节，仅语音频道）；只写不读，响应只出 has_password
        user_limit:
          type: integer
          description: 语音人数上限 0..100（#37，仅语音频道）；0 = 不限
        parent_id:
          type: string
          nullable: true
          x-go-type: ID
          description: 父频道 ID（#37，仅语音频道、最多两级）；省略 category_id 时继承父分类
    PatchChannelRequest:
      type: object
      title: PatchChannelRequest
      x-go-type: PatchChannelBody
      description: >
        JSON Merge Patch（RFC 7396，#31）：缺省 = 不改，null = 清空（name/type
        不可清，空值被校验拒 400；category_id 的 null = 移出分类；position 的
        null 拒 400——「删除位置」无语义），值 = 设置。#37：password 三态
        （缺省不改、null/空串清除、非空设置）；user_limit 的 null 拒 400；
        parent_id 的 null/0 = 提升顶层、值 = 设置父级。
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          enum: [text, voice]
        category_id:
          type: string
          nullable: true
          description: 0 = 显式移出分类；请求侧数字与字符串双接受（#31）
        position:
          type: integer
          nullable: true
        password:
          type: string
          nullable: true
          writeOnly: true
          description: 缺省 = 不改；null/空串 = 清除；非空 = 设置（1–72 字节，仅语音频道）
        user_limit:
          type: integer
          nullable: true
          description: 0 = 不限；null 拒 400
        parent_id:
          type: string
          nullable: true
          x-go-type: ID
          description: null/0 = 提升顶层；值 = 设置父级（仅语音频道、最多两级）
    CreateCategoryRequest:
      type: object
      title: CreateCategoryRequest
      required: [name]
      properties:
        name:
          type: string
          description: 1–32 字符
    PatchCategoryRequest:
      type: object
      title: PatchCategoryRequest
      x-go-type: PatchCategoryBody
      description: >
        JSON Merge Patch（RFC 7396，#31）：缺省 = 不改，null = 清空（name 不可清，
        空值被校验拒 400；position 的 null 拒 400），值 = 设置。
        name 与 position 至少给一个。
      properties:
        name:
          type: string
          nullable: true
        position:
          type: integer
          nullable: true
          description: 目标序（0-based）；服务端重排同服务器其它分类
    CreateMessageRequest:
      type: object
      title: CreateMessageRequest
      required: [content]
      properties:
        content:
          type: string
          description: 1–2000 字符
        nonce:
          type: string
          description: 幂等键（#31，≤64 字符）；同频道同用户重复提交回读原消息（200）。缺省不去重。
    Role:
      type: object
      title: Role
      description: 服务器角色（#35 B4）。permissions 为十进制字符串（低 15 位位掩码）。ID 为十进制字符串（#31）。
      required: [id, server_id, name, color, position, permissions, builtin, created_at, updated_at]
      properties:
        id:
          type: string
          x-go-type: ID
        server_id:
          type: string
          x-go-type: ID
        name:
          type: string
        color:
          type: string
          description: '#RRGGBB'
        position:
          type: integer
          description: 层级序（越大越高）；@everyone=0、admin=1、owner=2
        permissions:
          type: string
          description: 十进制权限位串（只用低 15 位）
        builtin:
          type: boolean
          description: 内置角色（@everyone/admin/owner）不可改删
        created_at:
          type: string
          format: date-time
          x-go-type: Time
        updated_at:
          type: string
          format: date-time
          x-go-type: Time
    CreateRoleRequest:
      type: object
      title: CreateRoleRequest
      required: [name, permissions]
      properties:
        name:
          type: string
          description: 1–32 字符
        color:
          type: string
          description: '#RRGGBB；缺省回落主题主色'
        position:
          type: integer
          description: 缺省 0；非 owner 必须严格小于其最高角色 position
        permissions:
          type: string
          description: 十进制权限位串；只允许低 15 位，且是操作者权限的子集
    UpdateRoleRequest:
      type: object
      title: UpdateRoleRequest
      required: [name, permissions]
      properties:
        name:
          type: string
          description: 1–32 字符
        color:
          type: string
          description: '#RRGGBB；缺省沿用现值'
        position:
          type: integer
          description: 缺省沿用现值；非 owner 必须严格小于其最高角色 position
        permissions:
          type: string
          description: 十进制权限位串；只允许低 15 位，且是操作者权限的子集
    SetMemberRolesRequest:
      type: object
      title: SetMemberRolesRequest
      required: [role_ids]
      properties:
        role_ids:
          type: array
          description: 全量替换（@everyone 强制保留；owner builtin 不可分配）
          items:
            type: string
            x-go-type: ID
    ChannelOverwrite:
      type: object
      title: ChannelOverwrite
