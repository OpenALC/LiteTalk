  /api/v1/channels/{id}/messages:
    get:
      operationId: listMessages
      summary: 消息分页（游标，倒序取页正序返回）
      description: >
        游标分页（#31）：limit 上限 50，默认 50；显式给出越界值返回 400 bad_limit。
        before 取更旧一页（ID 小于游标的最新 limit 条，旧→新正序返回）；after 取更新
        一页（ID 大于游标最早的 limit 条）。两者互斥，同给时 before 优先。禁用 offset。
        游标显式给出时必须 > 0（0 或负数返回 400 bad_cursor），缺省才表示「无游标」。
        before_id 为 before 的旧别名，兼容一个版本后移除。
        code：bad_request、bad_cursor、bad_limit、路径参数不合法；401；403 forbidden；
        404 not_found；5xx internal。
      tags: [messages]
      parameters:
        - $ref: '#/components/parameters/IDPath'
        - name: before
          in: query
          required: false
          description: 游标：只取 ID 小于该值的消息（缺省 = 最新一页；显式值须 > 0）
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: after
          in: query
          required: false
          description: 游标：只取 ID 大于该值的消息（向前翻更新；缺省 = 最旧一页；显式值须 > 0）
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: before_id
          in: query
          required: false
          description: 'before 的旧别名（兼容一个版本，#31；与 before 同义，显式值须 > 0）'
          deprecated: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          required: false
          description: 条数上限（1–50，缺省 50；显式越界返回 400 bad_limit）
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 消息数组（旧→新正序；不含发送者邮箱）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
    post:
      operationId: createMessage
      summary: 发送文字消息（≤2000 字 + 频控 20/分 + nonce 幂等）
      description: >
        仅文字频道。nonce（#31）：客户端生成的幂等键（≤64 字符），服务端按
        (channel_id, user_id, nonce) 去重；重复提交回读原消息返回 200（原消息体），
        新消息返回 201。幂等命中先于频控判断，不消耗配额。不带 nonce 不去重。
        code：bad_channel、bad_content、bad_nonce、bad_request、too_large、
        路径参数不合法；401；403 forbidden；404 not_found；429 rate_limited；
        5xx internal。
      tags: [messages]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: nonce 重放（幂等命中），原消息体（sender_* 为发送者昵称与 tag）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '201':
          description: 已发送（sender_* 为发送者昵称与 tag）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
