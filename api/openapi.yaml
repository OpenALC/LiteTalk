        deny:
          type: string
          description: 十进制权限位串（仅频道位）
        updated_at:
          type: string
          format: date-time
          x-go-type: Time
    SetOverwriteRequest:
      type: object
      title: SetOverwriteRequest
      required: [allow, deny]
