# LiteTalk REST 契约（唯一事实来源，OpenAPI 3.0.3）。
# 改 REST 形状必须先改本文件，再运行生成器（server 模块内，与 signalgen 同布局）：
#   go run -C server ./api/tools/openapigen
# 生成物：server/internal/api/api.gen.go、client/frontend/src/api/types.gen.ts。
# 手写实现层（server/internal/api/*.go）只实现生成的接口，禁止手改生成物。
#
# 口径说明：
# - 本文件描述 /api/v1 的现状（行为保持，#28 不改语义）；ID 字符串化、分页、
#   RFC 9457 等语义演进在 #31 落地时同步更新本文件。
# - /api/v1 下的全部对外端点都已纳入契约（含 GET /api/v1/healthz 与
#   POST /api/v1/rtc/credentials，#77 收编）。路径与方法是对外承诺，不得随意变更。
# - 错误体统一 application/problem+json（RFC 9457）；各操作 description 列出实际会出现的 code。
openapi: 3.0.3
info:
  title: LiteTalk API
  description: 轻音 LiteTalk 服务端 REST 面（/api/v1）。信令面见 api/signal/。
  version: 1.5.0
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
    description: 部署探活（免鉴权）
  - name: config
    description: 服务端能力开关（免鉴权）
  - name: auth
    description: 注册 / 登录 / 令牌 / 找回密码（免鉴权；除 logout 外要求 X-LiteTalk-Client ≥ 1.5）
  - name: rtc
    description: RTC 基础设施凭证（TURN/STUN 短期凭证）
  - name: users
    description: 当前用户
  - name: friends
    description: 好友与好友请求
  - name: servers
    description: 服务器、成员与邀请
  - name: channels
    description: 频道与分类
  - name: messages
    description: 文字频道消息
  - name: sync
    description: 事件续传失败后的聚合快照
paths:
  /api/v1/healthz:
    get:
      operationId: getHealthz
      summary: 健康检查（部署探活）
      description: >
        免鉴权。部署脚本与探针依赖该路径与方法（GET /api/v1/healthz），
        路径与方法不得变更。version 为构建期注入的服务端版本号。
      tags: [system]
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/rtc/credentials:
    post:
      operationId: postRtcCredentials
      summary: 签发 TURN 短期凭证
      description: >
        鉴权方式与信令一致：Authorization: Bearer <access_token>，或查询参数
        ?token=<access_token>（两者皆可，不要求 X-LiteTalk-Client）。
        未登录或令牌无效返回 401 unauthorized（不区分原因，避免泄露内部细节）；
        服务端未配置 TURN（LITETALK_TURN_SECRET 为空且内置 TURN 关闭）返回
        503 turn_unavailable，客户端按直连降级。响应 iceServers 可直接填入
        WebRTC 的 RTCConfiguration.iceServers。
      tags: [rtc]
      security: []
      responses:
        '200':
          description: ICE server 列表（STUN 条目无凭证；TURN 条目带 username/credential）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtcCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/TurnUnavailable'
  /api/v1/config:
    get:
      operationId: getConfig
      summary: 服务端能力开关
      description: 免鉴权。auth_mode=full|simple，mail_configured 为真实发信通道，self_host 一键自托管形态，bootstrap_required 管理员邀请码未消费。
      tags: [config]
      security: []
      responses:
        '200':
          description: 能力开关
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: 邮箱注册（simple 模式免验证码）
      description: >
        code：bad_device、bad_nickname、bad_email、bad_password、bad_bootstrap、
        bad_code、bad_request、too_large；409 email_taken；426 client_too_old；
        429 rate_limited；5xx internal / conflict / internal（writeStoreErr 映射）。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并签发令牌（含 bootstrap 认领后的默认服务器）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 邮箱密码登录
      description: >
        code：bad_device、bad_request、too_large；401 bad_credentials；
        426 client_too_old；429 rate_limited；5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并签发令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: 刷新令牌（旋转 refresh_token）
      description: >
        code：bad_request、too_large；401 unauthorized、session_replaced、
        session_replayed（另带响应头 X-LiteTalk-Auth）；426 client_too_old；
        5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 登出并吊销 refresh_token
      description: >
        鉴权凭据在请求体的 refresh_token（不走 Authorization 头）。
        code：bad_request、too_large；401 unauthorized；5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 已吊销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/email-code:
    post:
      operationId: sendEmailCode
      summary: 发送邮箱验证码
      description: >
        code：bad_email、bad_purpose、verification_not_required、bad_request、
        too_large；404 not_found；409 email_taken；426 client_too_old；
        429 rate_limited；5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '200':
          description: 已投递（或 Console 通道已打印）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/guest:
    post:
      operationId: guestLogin
      summary: 游客一键进入（simple 模式专属）
      description: >
        请求体可为空。code：bad_device、bad_request、too_large；
        403 guest_disabled；426 client_too_old；429 rate_limited；5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRequest'
      responses:
        '201':
          description: 游客身份创建成功并签发令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: 邮箱验证码重置密码
      description: >
        full 模式才可用；成功后吊销全部 refresh 并踢线。
        code：bad_password、bad_code、bad_request、too_large；
        403 reset_unavailable；404 not_found；426 client_too_old；
        429 rate_limited；5xx internal。
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 已重置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/users/me:
    get:
      operationId: getMe
      summary: 当前用户（自响应，含 email）
      description: '401 未登录；404 not_found；5xx internal。'
      tags: [users]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: patchMe
      summary: 改昵称（无头像字段）
      description: >
        昵称变更后 tag 重分配保证 (nickname,tag) 不冲突。
        code：bad_nickname、bad_request、too_large；401；409 conflict；5xx internal。
      tags: [users]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          description: 更新后的当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/friends:
    get:
      operationId: listFriends
      summary: 好友与好友请求列表
      description: >
        remark/group 仅发起方视角非空。user 为 PublicUser（不含 email，
        online 对已接受关系为真实在线态，pending/blocked 恒 false）。401；5xx internal。
      tags: [friends]
      responses:
        '200':
          description: 好友条目数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/friends/requests:
    post:
      operationId: createFriendRequest
      summary: 按 昵称#tag 发起好友请求
      description: >
        nickname 可写成「昵称#tag」整体。code：bad_target、bad_request、
        too_large；401；404 not_found；409 already_friends、request_exists；
        5xx internal。
      tags: [friends]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFriendRequest'
      responses:
        '201':
          description: 已建立 pending 关系
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/friends/{id}:
    delete:
      operationId: deleteFriend
      summary: 删除好友关系（双方任一方向）
      description: >
        code：bad_request（路径参数不合法）；401；403 forbidden；
        404 not_found；5xx internal。
      tags: [friends]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
    patch:
      operationId: patchFriend
      summary: 设置备注/分组（仅发起方）
      description: >
        空串清除备注/移出分组。code：bad_remark、bad_group、bad_request、
        too_large；401；403 forbidden；404 not_found；5xx internal。
      tags: [friends]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchFriendRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFriendRequest'
      responses:
        '200':
          description: 更新后的好友条目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/sync:
    get:
      operationId: getSync
      summary: 事件续传失败后的聚合快照
      description: >
        当前用户的全量视图快照：所在服务器（含分类与频道）与好友列表。
        只返回调用者为成员的服务器与频道；user 为 PublicUser（不含 email），
        online 对已接受好友关系为真实在线态（pending/blocked 恒 false）。续传失败
        （gateway.invalid_session）后客户端用
        一次请求恢复服务器/频道/好友视图；消息仍按会话内已见频道单独补拉。
        code：401；5xx internal。
      tags: [sync]
      responses:
        '200':
          description: 聚合快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/servers:
    post:
      operationId: createServer
      summary: 创建服务器（创建者自动成为 owner）
      description: >
        code：bad_name、bad_icon、bad_request、too_large；401；5xx internal。
        icon_name 默认 messages-square，icon_color 默认 #4FA4F3。
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServerRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Internal'
    get:
      operationId: listServers
      summary: 我所在的服务器列表
      description: '401；5xx internal。'
      tags: [servers]
      responses:
        '200':
          description: 服务器数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      summary: 接受好友请求（仅被请求方）
      description: >
        code：bad_request（路径参数不合法）；401；403 forbidden；
        404 not_found；409 bad_state；5xx internal。
      tags: [friends]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          description: 关系变为 accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/servers/{id}:
    patch:
      operationId: patchServer
      summary: 改服务器名称/图标（owner/admin）
      description: >
        code：bad_name、bad_icon、bad_request、too_large、路径参数不合法；
        401；403 forbidden；404 not_found；5xx internal。
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PatchServerRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServerRequest'
      responses:
        '200':
          description: 更新后的服务器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteServer
      summary: 解散服务器（仅 owner）
      description: >
        删除后踢出各频道房间成员。code：bad_request、路径参数不合法；
        401；403 forbidden；404 not_found；5xx internal。
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IDPath'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/servers/join:
    post:
      operationId: joinServer
      summary: 凭邀请码加入服务器
      description: >
        已是成员时直接返回服务器。code：bad_request、too_large；
        401；404 bad_code；409 code_exhausted；410 code_expired；5xx internal。
      tags: [servers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinServerRequest'
      responses:
        '200':
          description: 加入成功（或已在服务器中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        default:
          $ref: '#/components/responses/Internal'
  /api/v1/servers/{id}/members:
    get:
      operationId: listServerMembers
      summary: 服务器成员列表（成员可读）
      description: >
        支持 ETag 协商缓存（#31）：响应带 ETag，带 If-None-Match 命中回 304 无 body。
        code：bad_request、路径参数不合法；401；403 forbidden；
        5xx internal。user_id 为十进制 ID 字符串（#31）。
      tags: [servers]
      parameters:
        - $ref: '#/components/parameters/IDPath'
        - name: If-None-Match
          in: header
          required: false
          description: 上次响应的 ETag；命中回 304
