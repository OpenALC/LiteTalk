# 轻音 LiteTalk — Nginx 反向代理
# 部署位置：/etc/nginx/conf.d/litetalk.conf
# 作用：TLS 终结 + REST(/api/) 与 WebSocket(/ws) 反代到本机 Go 服务端。
# 与既有站点共存：本文件只声明 litetalk 一个 server 块，互不影响。
#
# 对应服务端「TLS 三种模式」的模式 2：服务端以 --behind-proxy 启动（不启 ACME，
# 纯 HTTP 监听 127.0.0.1:8077），本文件负责证书与 https。
# 并且必须在 /etc/litetalk.env 配置 LITETALK_TRUSTED_PROXIES=反代IP/CIDR，
# 否则 X-Real-IP 不被采信，限流/审计会把所有客户端记成反代 IP。
# 若改用服务端 --domain 自动签发，则不需要本文件（443/80 由 Go 进程直接监听）。

server {
    listen 443 ssl http2;
    server_name litetalk.example.com;   # 改成你的域名

    # 证书：acme.sh 签发后路径形如下面两行（按实际路径修改）
    #   acme.sh --issue -d litetalk.example.com --nginx
    ssl_certificate     /etc/ssl/litetalk/litetalk.example.com.crt;   # 占位
    ssl_certificate_key /etc/ssl/litetalk/litetalk.example.com.key;   # 占位
    ssl_protocols       TLSv1.2 TLSv1.3;

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # WebSocket 信令（升级头必须，长连接超时放宽）
    location /ws {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 80 → 443 跳转
server {
    listen 80;
    server_name litetalk.example.com;   # 同上
    return 301 https://$host$request_uri;
}
