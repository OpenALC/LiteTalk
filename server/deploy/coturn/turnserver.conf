# 轻音 LiteTalk — coturn (TURN/STUN) 配置
# 【可选】内置 TURN 已默认启用（LITETALK_TURN_PORT=3478，UDP+TCP），单机部署无需 coturn。
# 仅在以下场景才需要外部 coturn：多机中继、TURN-over-TLS(5349)、与已有 coturn 复用。
# 使用外部 coturn 时：LITETALK_TURN_PORT=0 关闭内置，并显式配 LITETALK_TURN_URLS/LITETALK_STUN_URLS。
# 部署位置：/etc/coturn/turnserver.conf
# 约 20%–40% 的 WebRTC 连接需要 TURN 中继才能穿透 NAT。

# 监听
listening-port=3478
tls-listening-port=5349
# listening-ip=内网IP          # 多网卡机器取消注释并填内网 IP
external-ip=公网IP             # 必改：阿里云等 NAT 后的公网 IP

# 中继端口段（安全组/防火墙需放行该段 UDP）
min-port=49152
max-port=49200

# 认证：use-auth-secret + 短期凭证（与服务端 LITETALK_TURN_SECRET 一致）
# 服务端 POST /api/v1/rtc/credentials 会按 HMAC-SHA1 签发 username=过期时间:用户
use-auth-secret
static-auth-secret=CHANGE_ME   # 必改：与 litetalk.env 里 LITETALK_TURN_SECRET 相同
# 凭证最长有效期 12 小时（与服务端签发一致）
stale-nonce=600

# TLS 证书（启用 TCP/TLS 中继必配；证书路径按部署机实际填写）
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem

# 安全与兼容
fingerprint
no-multicast-peers
no-loopback-peers
# 拒绝中继到内网/链路本地/ULA 等地址（#25）。coturn 允许同一关键字多行。
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli
# realm=litetalk.example.com   # 建议设置为你的域名

# 日志（journald 收走时用简要格式）
log-file=stdout
simple-log
